<div class="expert-preview-root" [class.auth]="isAuthenticated">
  <!-- show full paragraphs for authenticated users -->
  <ng-container *ngIf="isAuthenticated; else previewMode">
    <div class="expert-body">
      <p *ngFor="let paragraph of paragraphs" [innerHTML]="paragraph"></p>
    </div>
  </ng-container>

  <!-- preview mode for unauthenticated users -->
  <ng-template #previewMode>
    <div class="expert-body preview-clip">
      <p
        #paraRef
        *ngFor="let paragraph of visibleParagraphs; index as i"
        [attr.data-idx]="i"
        class="expert-paragraph"
        [style.webkitMaskImage]="'none'"
        [style.filter]="filterForIndex(i)"
        [innerHTML]="paragraph">
      </p>
    </div>

    <!-- call to action overlay -->
   <div class="signup-overlay">
      <div class="signup-inner">
        <div class="message">
          <strong>You're missing the full analysis.</strong>
          <div style="margin-top:5px;">Sign up to read the rest — unlock in-depth commentary and analysis.</div>
        </div>
        <div class="buttons">
          <button mat-flat-button color="primary" [routerLink]="'/signup'">Sign up</button>
        </div>
      </div> 
    </div>
  </ng-template>
</div>
