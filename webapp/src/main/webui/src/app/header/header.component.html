<div>
    <div class="title" [ngClass]="{'bigScreen': !isSmallScreen}">
       <div class="vertical-layout logo-section">

           <a class="unstyled" href="/"><img class="logo" [src]="assetPrefix + 'images/poliscore-word.webp'" alt="PoliScore Logo"></a>
           <span class="logo-subtitle">{{getTagLine()}}</span>
           <!-- <button class="year" mat-raised-button>{{ year }} (118th congress)</button> -->
           <!-- <div class="horizontal-layout namespace-picker"><button mat-raised-button class="year" href="#">U.S. Congress</button> <button mat-raised-button class="year" href="#">{{year}} (118th)</button></div> -->

          <div class="horizontal-layout year-and-namespace">
            <mat-select class="namespace" [(value)]="namespace" [panelClass]="'dropdown-panel'">
              <mat-option *ngFor="let ns of namespaces" [value]="ns" (click)="onChangeNamespace(ns)" psTrackClick [psTrackClickId]="'change_namespace'">{{ namespaceDisplayLabel(ns) }}</mat-option>
            </mat-select>
          
            <mat-select class="year" [(value)]="year" [panelClass]="'dropdown-panel'">
              <mat-option *ngFor="let y of years" [value]="y" (click)="onChangeYear(y)" psTrackClick [psTrackClickId]="'change_year'">{{ yearDisplayLabel(y) }}</mat-option>
            </mat-select>

            <div *ngIf="!isSmallScreen" class="account bigScreen vertical-layout">
              <mat-select *ngIf="auth.isAuthenticated$ | async as isAuthed; else loggedOut" class="select loggedin" [placeholder]="'logged in as\n' + (auth.displayName$ | async)" [panelClass]="'dropdown-panel'">
                <mat-option (click)="onManageSubscription()" psTrackClick [psTrackClickId]="'manage_account'">Manage Account</mat-option>
                <mat-option (click)="auth.logout()" psTrackClick [psTrackClickId]="'logout'">Logout</mat-option>
              </mat-select>
              <ng-template #loggedOut><mat-select class="select loggedout" [placeholder]="'login or signup'" [panelClass]="'dropdown-panel'">
                <mat-option (click)="auth.login()" psTrackClick [psTrackClickId]="'login'">Login</mat-option>
                <mat-option [routerLink]="'/signup'">Signup</mat-option>
              </mat-select></ng-template>
              <label *ngIf="subscriptionLoaded && (auth.isAuthenticated$ | async) && !isSubscribed" style="color:red; cursor: pointer;" (click)="signUp()" class="sub-expired">Your subscription has expired!</label>
            </div>
          </div>

          <div *ngIf="isSmallScreen" class="account smallScreen vertical-layout align-left">
            <mat-select *ngIf="auth.isAuthenticated$ | async as isAuthed; else loggedOut" class="select loggedin" [placeholder]="'logged in as\n' + (auth.displayName$ | async)" [panelClass]="'dropdown-panel'">
              <mat-option (click)="onManageSubscription()" psTrackClick [psTrackClickId]="'manage_account'">Manage Account</mat-option>
              <mat-option (click)="auth.logout()" psTrackClick [psTrackClickId]="'logout'">Logout</mat-option>
            </mat-select>
            <ng-template #loggedOut><mat-select class="select loggedout" [placeholder]="'login or signup'" [panelClass]="'dropdown-panel'">
              <mat-option (click)="auth.login()" psTrackClick [psTrackClickId]="'login'">Login</mat-option>
              <mat-option [routerLink]="'/signup'">Signup</mat-option>
            </mat-select></ng-template>
            <label *ngIf="subscriptionLoaded && (auth.isAuthenticated$ | async) && !isSubscribed" style="color:red; cursor: pointer;" (click)="signUp()" class="sub-expired">Your subscription has expired!</label>
          </div>
       </div>
       <div class="horizontal-layout" style="flex-direction: row-reverse !important;">
        <div class="nav-buttons vertical-layout" style="align-items: flex-end; gap: 6px;">
          <button *ngIf="legislators" mat-raised-button [routerLink]="routingNamespace + '/legislators'"><a [routerLink]="routingNamespace + '/legislators'" class="unstyled"><span>Legislators</span></a></button>
          <button *ngIf="bills" mat-raised-button [routerLink]="routingNamespace + '/bills'"><a [routerLink]="routingNamespace + '/bills'" class="unstyled"><span>Bills</span></a></button>
          <button *ngIf="congress" mat-raised-button [routerLink]="routingNamespace + '/party'"><a [routerLink]="routingNamespace + '/party'" class="unstyled"><span>Party Stats</span></a></button>
          <button *ngIf="about" mat-raised-button class="about-button" [routerLink]="'/'"><a href="/" class="unstyled"><span>About</span></a></button>
        </div>
      </div>
   </div>
</div>
